[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "licensing-agent"
version = "0.1.0"
description = "On-premises Microsoft licensing advisor infrastructure and calculator"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<10",
  "PyYAML>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6,<7",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/licensing_calc", "src/api"]

[project.scripts]
licensing-calc-schema = "licensing_calc.schema:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
