name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint, test, and build web app when implemented
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f web/package.json ]]; then
            echo "Web phase not implemented; no package.json. Skipping web checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm ci --prefix web
          npm run lint --prefix web
          npm test --prefix web
          npm run build --prefix web
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and lint without Azure login
        shell: bash
        env:
          DEPLOY_PRINCIPAL_ID: 00000000-0000-0000-0000-000000000001
          API_APP_ID_URI: api://ci-validation
        run: |
          set -euo pipefail
          az bicep install
          mkdir -p build
          az bicep build --file infra/main.bicep --outfile build/main.json
          az bicep lint --file infra/main.bicep
          for environment in dev prod; do
            az bicep build-params --file "infra/env/$environment.bicepparam" --outfile "build/$environment.parameters.json"
          done
          bash -n scripts/bootstrap/bootstrap.sh scripts/poll-capability-hosts.sh scripts/get-api-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-arm
          path: build/*.json
          if-no-files-found: error
